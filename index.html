<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <script>
        humanScore = 0;
        computerScore = 0;

        function getComputerChoice(max){
            return Math.floor(Math.random()*max); 
        }

        let computerNumber = getComputerChoice(3)
        let computerChoice;

        if (computerNumber === 2){
            computerChoice = "rock";
        } else if (computerNumber === 1){
            computerChoice = "paper";
        } else (computerNumber === 0)
            computerChoice = "scissors";
        

        function getHumanChoice(){
            let humanChoice = "";

            while(true){
                let input = prompt("Rock, Paper or Scissors?").toLowerCase();

                if (input === "rock" || input === "paper" || input === "scissors"){
                    humanChoice = input;
                    break;
                }
            }
            return humanChoice;

        }
        
        function playRound(humanSelection, computerSelection){
            if (humanSelection === computerSelection){
                console.log("Tie : ", humanScore, " : ", computerScore)
            }
            else if ((humanSelection === "paper" && computerSelection === "rock")||
                     (humanSelection === "rock" && computerSelection === "scissors")||
                     (humanSelection === "scissors" && computerSelection === "paper")){
                        humanScore+1;
                        console.log("You won this round: ", humanScore, " : ", computerScore)
                     }
            else{
                computerScore+1;
                console.log("The computer won this round: ", humanScore, " : ", computerScore)
            }
        }

        for (let i = 0; i < 5; i++){
            const humanSelection = getHumanChoice();
            const computerSelection = getComputerChoice();
            playRound(humanSelection, computerSelection);
        }
        
    </script>
</body>
</html>
